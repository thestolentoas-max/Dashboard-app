<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Dark Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="spotlight-aura spotlight-one"></div>
    <div class="spotlight-aura spotlight-two"></div>

    <button class="focus-mode-toggle-btn" onclick="toggleFocusMode()" title="Toggle Focus Mode">👁️ Focus Mode</button>

    <div class="dashboard-wrapper">
        
        <!-- SCREEN 1: CLOCK & MATCHING AUDIO CONTROLS -->
        <section class="dashboard-screen" id="clockSec">
            <div class="glass-card element-reveal">
                <div class="greeting-container hide-in-focus">
                    <h2 class="greeting-text" id="greetingDisplay" onclick="editName()">Good morning, Alex!</h2>
                    <div class="name-editor hidden" id="nameEditor">
                        <input type="text" id="nameInput" maxlength="20" class="name-input">
                        <button class="btn-text" onclick="saveName()">Done</button>
                    </div>
                    <p class="greeting-subtext" id="greetingSubtext">Time to crush your goals today.</p>
                </div>

                <div class="clock-display">
                    <div class="time-main" id="timeMain">00:00:00</div>
                    <div class="time-ampm" id="timeAmpm">AM</div>
                    <div class="date-sub" id="dateSub">LOADING DATE...</div>
                </div>

                <!-- MATCHING VECTOR AUDIO CONTROL PANEL MAP -->
                <div class="soundscape-control-row hide-in-focus">
                    <button class="soundscape-pill" id="sound-rain" onclick="toggleAmbientSound('rain', 0.12)" title="Heavy Rain Shower">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2v2M4.22 4.22l1.42 1.42M1 12h2M21 12h2M18.36 5.64l1.42-1.42M20 17.5c0 1.93-1.57 3.5-3.5 3.5h-9A4.5 4.5 0 0 1 3 16.5c0-2.2 1.63-4.03 3.75-4.43A6.002 6.002 0 0 1 18 11c0 .24-.01.48-.04.71A4.49 4.49 0 0 1 20 15.5v2z"/>
                        </svg>
                    </button>
                    <button class="soundscape-pill" id="sound-fire" onclick="toggleAmbientSound('fire', 0.16)" title="Crackling Campfire">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2v2M4.22 4.22l1.42 1.42M1 12h2M21 12h2M18.36 5.64l1.42-1.42M5 17h14M7 21h10"/>
                        </svg>
                    </button>
                    <button class="soundscape-pill" id="sound-white" onclick="toggleAmbientSound('white', 0.06)" title="Deep Static Noise">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2v2M4.22 4.22l1.42 1.42M1 12h2M21 12h2M18.36 5.64l1.42-1.42M3 16h18M3 20h18"/>
                        </svg>
                    </button>
                </div>

                <div class="scroll-prompt hide-in-focus" onclick="scrollToSection('goalsSec')">SCROLL FOR MICRO GOALS<div class="arrow">↓</div></div>
            </div>
        </section>

        <!-- SCREEN 2: MICRO GOALS OBJECTIVES PANEL -->
        <section class="dashboard-screen" id="goalsSec">
            <div class="glass-card element-reveal">
                <div class="card-header-block">
                    <h4 class="card-header-text">DAILY MICRO GOALS</h4>
                    <p class="card-header-sub">Keep your focus bite-sized and clear.</p>
                </div>
                <div class="micro-goals-checklist-panel">
                    <div class="checklist-input-row">
                        <input type="text" id="goalTextInput" placeholder="Add a daily micro-goal..." onkeydown="handleGoalInputKey(event)">
                        <button onclick="addMicroGoalItem()">+</button>
                    </div>
                    <div class="checklist-items-scroll" id="checklistItemsContainer"></div>
                </div>
                <div class="scroll-prompt" onclick="scrollToSection('timerSec')">SCROLL FOR TIMER<div class="arrow">↓</div></div>
            </div>
        </section>

        <!-- SCREEN 3: COUNTDOWN TIMER -->
        <section id="timerSec" class="dashboard-screen">
            <div class="glass-card element-reveal">
                <div class="timer-visual-container">
                    <div class="liquid-container-ring"><div class="liquid-wave-element" id="liquidFill"></div></div>
                    <div class="timer-text-overlay" id="countdownDisplay" onclick="openTimerSettings()">05:00</div>
                    <div class="timer-input-overlay hidden" id="timerInputOverlay">
                        <input type="text" id="inputMinutes" maxlength="2" value="05" oninput="this.value = this.value.replace(/[^0-9]/g, '')" onkeydown="handleTimerInputKey(event)">
                        <span>:</span>
                        <input type="text" id="inputSeconds" maxlength="2" value="00" oninput="this.value = this.value.replace(/[^0-9]/g, '')" onkeydown="handleTimerInputKey(event)">
                        <div style="width:100%; margin-top:10px;"><button class="btn-text-small" onclick="saveTimerSettings()">Set Time</button></div>
                    </div>
                </div>
                <div class="timer-presets-row hide-in-focus">
                    <button class="preset-pill" onclick="loadTimerPreset(25)">⏱️ 25m</button>
                    <button class="preset-pill" onclick="loadTimerPreset(15)">⏱️ 15m</button>
                    <button class="preset-pill" onclick="loadTimerPreset(5)">⏱️ 5m</button>
                </div>
                <div class="color-customizer-tray hide-in-focus">
                    <span class="theme-dot orange active" onclick="switchActiveThemeColor('orange')"></span>
                    <span class="theme-dot mint" onclick="switchActiveThemeColor('mint')"></span>
                    <span class="theme-dot cyan" onclick="switchActiveThemeColor('cyan')"></span>
                    <span class="theme-dot magenta" onclick="switchActiveThemeColor('magenta')"></span>
                </div>
                <div class="timer-controls">
                    <button class="control-btn" onclick="cancelTimer()">Cancel</button>
                    <button class="control-btn btn-pause" id="pauseBtn" onclick="toggleTimer()">Start</button>
                </div>
            </div>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
